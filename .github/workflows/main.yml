name: Build Meskot APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unzip project
        run: unzip -q meskot-android.zip
      - name: Install
        working-directory: meskot-android
        run: npm install
      - name: Add Android platform
        working-directory: meskot-android
        run: |
          npx cap add android
          python3 scripts/patch_android.py
      - name: Icon
        working-directory: meskot-android
        run: npx capacitor-assets generate --android || echo "icon skipped"
      - name: Sync
        working-directory: meskot-android
        run: npx cap sync android
      - name: Build APK
        working-directory: meskot-android/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK
        run: cp meskot-android/android/app/build/outputs/apk/debug/app-debug.apk Meskot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Meskot-APK
          path: Meskot.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Meskot.apk \
            --title "Meskot v${{ github.run_number }}" \
            --notes "Android APK (debug build). Download Meskot.apk and install it on your phone."
